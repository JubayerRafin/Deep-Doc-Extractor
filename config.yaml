# ============================================================
# Deep Doc Extractor — Pipeline Configuration
# Team DocuForge | Woosong University Capstone 2026
# ============================================================

input:
  pdf_path: "hp-e877-series-user-guide.pdf"
  test_pages: null

stage1:
  output_dir: "output/stage1"
  text:
    min_block_chars: 5
    heading_font_threshold: 1.2
    bold_font_keywords:
      - "NOTE:"
      - "CAUTION:"
      - "WARNING:"
      - "IMPORTANT:"
      - "TIP:"
  images:
    output_subdir: "images"
    min_width: 50
    min_height: 50
    image_format: "png"
  tables:
    output_subdir: "tables"
    flavor: "lattice"
    fallback_flavor: "stream"
    output_format: "json"

stage2:
  output_dir: "output/stage2"
  input_md: null

  chunking:
    max_tokens: 400
    overlap_sentences: 1
    min_chunk_length: 50

  classifier:
    procedure_keywords:
      - "step"
      - "follow these steps"
      - "instructions"
      - "how to"
      - "install"
      - "replace"
      - "remove"
      - "insert"
      - "open the"
      - "close the"
      - "select"
      - "press"
    spec_keywords:
      - "dimensions"
      - "weight"
      - "specification"
      - "supported"
      - "compatible"
      - "capacity"
      - "speed"
      - "resolution"
    rule_error_keywords:
      - "caution"
      - "warning"
      - "note"
      - "error"
      - "troubleshoot"
      - "problem"
      - "jam"
      - "do not"
      - "important"

  llm:
    model: "qwen3.5:9b"
    base_url: "http://localhost:11434"
    temperature: 0.3              # was 0.7 — LLD §3.3 specifies 0.3 for grounded Q&A
    max_tokens: 4096
    timeout: 600
    system_roles:
      - "You are a helpful HP printer technician."
      - "You are a printer hardware expert."
      - "You are an HP technical support specialist."
      - "You are a customer service agent for HP printers."

  filters:
    min_question_length: 10
    min_answer_length: 5                              # was 20 — spec answers ("6 GB") are valid
    max_answer_length: 2000
    weak_answer_patterns:
      - "I don't know"
      - "refer to the manual"
      - "N/A"
      # NOTE: removed "not available" — was rejecting legitimate answers like
      # "if this check box is not available, the feature is unavailable"
    hallucination_similarity_threshold: 0.40          # was implicit 0.55 — empirical tuning for HP corpus
    hallucination_bypass_categories: ["spec"]         # spec chunks are tables; embeddings unreliable
    dedup_similarity_threshold: 0.92
    embedding_model: "all-MiniLM-L6-v2"
    # enforce_language: "any"                         # off (supports both EN and KO per FR030)

  export:
    jsonl: true
    csv: true
    dli_kb: true

# ============================================================
# STAGE 3 — Dataset Augmentation
# Paraphrases accepted Stage 2 questions to multiply dataset size.
# Preserves the original answer unchanged on every variation.
# ============================================================
stage3:
  output_dir: "output/stage3"

  # Optional: override Stage 2 input file (defaults to stage2/qa_pairs.jsonl)
  input_jsonl: null

  llm:
    base_url: "http://localhost:11434"
    model: "qwen3.5:9b"              # same model as Stage 2
    fallback_model: "qwen3.5:9b"     # retried once if primary model errors
    temperature: 0.7                 # higher than Stage 2 — encourages variety
    max_tokens: 512
    timeout: 600

  augmentation:
    variations_per_qa: 3             # ask LLM for 3, filter keeps ~2

  filter:
    similarity_max: 0.97             # drop near-duplicates (no diversity gain)
    similarity_min: 0.70             # drop semantic drift (meaning changed)
    min_variation_length: 10         # char count
    embedding_model: "all-MiniLM-L6-v2"

  export:
    jsonl: true                      # augmented.jsonl  (originals + variations)
    csv: true                        # augmented.csv    (same data, CSV)
    mentor_batch: true               # mentor_batch.jsonl (FR021 — GPU handoff)

# ============================================================
# STAGE 4 — RAG Chat Service
# Builds a hybrid Chroma vector index (Stage 1 chunks + Stage 2/3 Q&A pairs)
# and serves grounded answers over it via Streamlit.
# ============================================================
stage4:
  output_dir: "output/stage4"

  # Data sources for the index. Null = auto-resolve from earlier stage output_dirs.
  sources:
    markdown_glob: null              # default: stage1.output_dir/*.md
    augmented_jsonl: null            # default: stage3.output_dir/augmented.jsonl (preferred)
    qa_jsonl: null                   # default: stage2.output_dir/qa_pairs.jsonl  (fallback)

  # Retrieval-specific chunker (RE-CHUNKS Stage 1 markdown — separate from Stage 2 chunking)
  chunking:
    max_tokens: 512                  # slightly larger than Stage 2 — retrieval needs more context
    overlap_sentences: 1
    min_chunk_chars: 80

  # Sentence-transformer for indexing AND query-time embedding
  embedding:
    model: "all-MiniLM-L6-v2"        # 384-d, same family used in Stage 2 dedup
    batch_size: 32
    device: "cpu"

  # Persistent ChromaDB store (SQLite + parquet under persist_dir)
  chroma:
    persist_dir: "output/stage4/chroma"
    collection_name: "hp_e877_manual"

  # Retrieval tuning
  retrieval:
    top_k: 10                        # over-fetch, then score-filter
    max_final_hits: 5                # cap what is shown to the LLM
    min_score: 0.3                   # cosine similarity floor; empty list if none pass
    qa_fast_path_score: 0.85         # promote a very-confident QA-pair hit to position 0

  # Answer generation — Qwen3.5:9B via Ollama (same stack as Stage 2/3)
  llm:
    base_url: "http://localhost:11434"
    model: "qwen2.5:3b"
    temperature: 0.2                 # LOW — grounded factual answers, not variety
    max_tokens: 1024
    timeout: 600
    max_context_chars: 6000          # cap injected context so we don't blow past Qwen's window

  # UI
  ui:
    host: "localhost"
    port: 8501

  # FR028 — offline enforcement (blocks any non-loopback socket connection)
  offline:
    enforce: true
    log_path: "output/stage4/offline_guard.log"

ocr:
  enabled: false
  language: "en"
