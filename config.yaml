# ============================================================
# Deep Doc Extractor — Pipeline Configuration
# Team DocuForge | Woosong University Capstone 2026
#
# MULTI-MODEL EXPERIMENT WORKFLOW
# --------------------------------
# To compare different LLMs, change only THREE things per run:
#   1.  experiment.tag              (e.g. "qwen36_27b" or "mistral_24b")
#   2.  stage2.llm.model            (the Ollama model name)
#   3.  stage3.llm.model            (same model name)
#
# Output folders auto-key off experiment.tag, so different runs never
# overwrite each other. Run-by-run setup:
#
#   Run 1 — Qwen 3.5 9B baseline (laptop):
#       tag: "qwen35_9b"     model: "qwen3.5:9b"
#
#   Run 2 — Qwen 3.6 27B (GPU server):
#       tag: "qwen36_27b"    model: "qwen3.6:27b"
#
#   Run 3 — Mistral 24B (GPU server):
#       tag: "mistral_24b"   model: "mistral-small3.2:24b"
#
#   Run 4 — Qwen 3.6 35B (GPU server):
#       tag: "qwen36_35b"    model: "qwen3.6:35b"
#
# Then evaluate each run:
#   python evaluation/evaluate_all.py \
#       --pairs output/stage2_<TAG>/qa_pairs.jsonl \
#       --output-dir eval_results_<TAG>/
# ============================================================

# ----- experiment knobs (change per run) -----
experiment:
  tag: "qwen36_27b"             # <-- CHANGE PER EXPERIMENT (used in output paths)

input:
  pdf_path: "hp-e877-series-user-guide.pdf"
  test_pages: null              # set to e.g. [1,2,3,4,5] for a smoke test

# ============================================================
# STAGE 1 — Document Extraction
# ============================================================
stage1:
  output_dir: "output/stage1"   # shared across all experiments — Stage 1 is deterministic
  text:
    min_block_chars: 5
    heading_font_threshold: 1.2
    bold_font_keywords:
      - "NOTE:"
      - "CAUTION:"
      - "WARNING:"
      - "IMPORTANT:"
      - "TIP:"
  images:
    output_subdir: "images"
    min_width: 50
    min_height: 50
    image_format: "png"
  tables:
    output_subdir: "tables"
    flavor: "lattice"
    fallback_flavor: "stream"
    output_format: "json"

# ============================================================
# STAGE 2 — Q&A Dataset Generation
# ============================================================
stage2:
  output_dir: "output/stage2_qwen36_27b"   # <-- update to match experiment.tag
  input_md: null

  chunking:
    max_tokens: 400
    overlap_sentences: 1
    min_chunk_length: 50

  classifier:
    procedure_keywords:
      - "step"
      - "follow these steps"
      - "instructions"
      - "how to"
      - "install"
      - "replace"
      - "remove"
      - "insert"
      - "open the"
      - "close the"
      - "select"
      - "press"
    spec_keywords:
      - "dimensions"
      - "weight"
      - "specification"
      - "supported"
      - "compatible"
      - "capacity"
      - "speed"
      - "resolution"
    rule_error_keywords:
      - "caution"
      - "warning"
      - "note"
      - "error"
      - "troubleshoot"
      - "problem"
      - "jam"
      - "do not"
      - "important"

  llm:
    model: "qwen3.6:27b"            # <-- CHANGE PER EXPERIMENT
    base_url: "http://localhost:11434"
    temperature: 0.3                # LLD §3.3: 0.3 for grounded Q&A
    max_tokens: 4096
    timeout: 600
    system_roles:
      - "You are a helpful HP printer technician."
      - "You are a printer hardware expert."
      - "You are an HP technical support specialist."
      - "You are a customer service agent for HP printers."

  filters:
    min_question_length: 10
    min_answer_length: 5                                # spec answers ("6 GB") are valid
    max_answer_length: 2000
    weak_answer_patterns:
      - "I don't know"
      - "refer to the manual"
      - "N/A"
      - "not included in the provided text"
      - "not included in the text"
      - "not provided in the text"
      - "the text does not provide"
      - "detailed steps are not"
      # NOTE: do NOT add "not available" — rejects legitimate answers like
      # "if this check box is not available, the feature is unavailable"
    hallucination_similarity_threshold: 0.55            # empirical tuning for HP corpus
    hallucination_bypass_categories: ["spec"]           # spec chunks are tables; embeddings unreliable
    dedup_similarity_threshold: 0.92
    embedding_model: "all-MiniLM-L6-v2"

  export:
    jsonl: true
    csv: true
    dli_kb: true

# ============================================================
# STAGE 3 — Dataset Augmentation
# ============================================================
stage3:
  output_dir: "output/stage3_qwen36_27b"   # <-- update to match experiment.tag
  input_jsonl: null                         # auto-resolves from stage2.output_dir

  llm:
    base_url: "http://localhost:11434"
    model: "qwen3.6:27b"            # <-- CHANGE PER EXPERIMENT (keep same family as stage2)
    fallback_model: "qwen3.6:27b"   # retried once if primary errors
    temperature: 0.7                # higher than Stage 2 — encourages variety
    max_tokens: 512
    timeout: 600

  augmentation:
    variations_per_qa: 3            # ask LLM for 3, filter keeps ~2

  filter:
    similarity_max: 0.97            # drop near-duplicates
    similarity_min: 0.70            # drop semantic drift
    min_variation_length: 10
    embedding_model: "all-MiniLM-L6-v2"

  export:
    jsonl: true
    csv: true
    mentor_batch: true              # FR021 — GPU handoff format

# ============================================================
# STAGE 4 — RAG Chat Service
# Independent of stage 2/3 LLM choice — keep this stable across experiments.
# ============================================================
stage4:
  output_dir: "output/stage4_qwen36_27b"   # <-- update to match experiment.tag

  sources:
    markdown_glob: null
    augmented_jsonl: null           # auto-resolves from stage3.output_dir
    qa_jsonl: null                  # fallback if augmented not found

  chunking:
    max_tokens: 512
    overlap_sentences: 1
    min_chunk_chars: 80

  embedding:
    model: "all-MiniLM-L6-v2"
    batch_size: 32
    device: "cpu"

  chroma:
    persist_dir: "output/stage4_qwen36_27b/chroma"   # <-- update to match experiment.tag
    collection_name: "hp_e877_manual"

  retrieval:
    top_k: 10
    max_final_hits: 5
    min_score: 0.3
    qa_fast_path_score: 0.85

  llm:
    base_url: "http://localhost:11434"
    model: "qwen2.5:3b"             # RAG answer model — keep stable to compare retrieval quality
    temperature: 0.2
    max_tokens: 1024
    timeout: 600
    max_context_chars: 6000

  ui:
    host: "localhost"
    port: 8501

  offline:
    enforce: true
    log_path: "output/stage4_qwen36_27b/offline_guard.log"   # <-- update to match experiment.tag

ocr:
  enabled: false
  language: "en"
