# ============================================================
# Deep Doc Extractor — Pipeline Configuration
# Team DocuForge | Woosong University Capstone 2026
# ============================================================
#
# Single source of truth for all pipeline parameters (FR030).
# Override per-experiment via scripts/switch_experiment.py
# ============================================================

# ─── Input ──────────────────────────────────────────────────
input:
  # Source PDF — NOT committed to git (too large).
  # Teammates: place your PDF here or update this path.
  pdf_path: "data/source_pdfs/hp-e877-series-user-guide.pdf"
  test_pages: null                                  # null = process all pages; or [35, 36] for testing

# ─── Experiment tagging (for multi-model comparison) ────────
experiment:
  tag: "qwen35_9b"                                  # used by switch_experiment.py to namespace outputs

# ============================================================
# STAGE 1 — PDF → Markdown extraction
# ============================================================
stage1:
  output_dir: "data/stage1_output"                  # committed to git so teammates can run Stage 2 directly
  text:
    min_block_chars: 5
    heading_font_threshold: 1.2
    bold_font_keywords:
      - "NOTE:"
      - "CAUTION:"
      - "WARNING:"
      - "IMPORTANT:"
      - "TIP:"
  images:
    output_subdir: "images"
    min_width: 50
    min_height: 50
    image_format: "png"
  tables:
    output_subdir: "tables"
    flavor: "lattice"
    fallback_flavor: "stream"
    output_format: "json"

# ============================================================
# STAGE 2 — Markdown → Q&A pair generation
# ============================================================
stage2:
  output_dir: "output/stage2"                       # NOT committed (output/ is gitignored, regenerable)

  # Read Stage 1 markdown from the committed data/ folder.
  # Teammates can run Stage 2 immediately after cloning, without re-running Stage 1.
  input_md: "data/stage1_output/hp-e877-series-user-guide.md"

  chunking:
    max_tokens: 400
    overlap_sentences: 1
    min_chunk_length: 50

  classifier:
    procedure_keywords:
      - "step"
      - "follow these steps"
      - "instructions"
      - "how to"
      - "install"
      - "replace"
      - "remove"
      - "insert"
      - "open the"
      - "close the"
      - "select"
      - "press"
    spec_keywords:
      - "dimensions"
      - "weight"
      - "specification"
      - "supported"
      - "compatible"
      - "capacity"
      - "speed"
      - "resolution"
    rule_error_keywords:
      - "caution"
      - "warning"
      - "note"
      - "error"
      - "troubleshoot"
      - "problem"
      - "jam"
      - "do not"
      - "important"

  llm:
    model: "qwen3.5:9b"                             # overridden per-teammate by switch_experiment.py
    base_url: "http://localhost:11434"
    temperature: 0.3                                # LLD §3.3 — low temp for grounded Q&A
    max_tokens: 4096
    timeout: 600
    system_roles:
      - "You are a helpful HP printer technician."
      - "You are a printer hardware expert."
      - "You are an HP technical support specialist."
      - "You are a customer service agent for HP printers."

  filters:
    min_question_length: 10
    min_answer_length: 5                            # spec answers like "6 GB" are valid
    max_answer_length: 2000
    weak_answer_patterns:
      - "I don't know"
      - "refer to the manual"
      - "N/A"
      - "not included in the provided text"
      - "not included in the text"
      - "not provided in the text"
      - "the text does not provide"
      - "detailed steps are not"
      # NOTE: removed "not available" — was rejecting legitimate answers like
      # "if this check box is not available, the feature is unavailable"
    hallucination_similarity_threshold: 0.55        # empirical tuning for HP corpus
    hallucination_bypass_categories: ["spec"]       # spec chunks are tables; embeddings unreliable
    dedup_similarity_threshold: 0.92
    embedding_model: "all-MiniLM-L6-v2"

  export:
    jsonl: true
    csv: true
    dli_kb: true

# ============================================================
# STAGE 3 — Dataset Augmentation
# Paraphrases accepted Stage 2 questions to multiply dataset size.
# Preserves the original answer unchanged on every variation.
# ============================================================
stage3:
  output_dir: "output/stage3"                       # NOT committed (regenerable)

  # Optional: override Stage 2 input file (defaults to {stage2.output_dir}/qa_pairs.jsonl)
  input_jsonl: null

  llm:
    base_url: "http://localhost:11434"
    model: "qwen3.5:9b"                             # match Stage 2 for consistency
    fallback_model: "qwen3.5:9b"                    # retried once if primary errors
    temperature: 0.7                                # higher than Stage 2 — encourages variety
    max_tokens: 512
    timeout: 600

  augmentation:
    variations_per_qa: 3                            # ask LLM for 3, filter keeps ~2

  filter:
    similarity_max: 0.97                            # drop near-duplicates (no diversity gain)
    similarity_min: 0.70                            # drop semantic drift (meaning changed)
    min_variation_length: 5                         # chars — short variations like "Print?" are OK
    embedding_model: "all-MiniLM-L6-v2"

  export:
    jsonl: true                                     # augmented.jsonl (originals + variations)
    csv: true                                       # augmented.csv (same data, CSV)
    mentor_batch: true                              # mentor_batch.jsonl (FR021 — GPU handoff)

# ============================================================
# STAGE 4 — RAG Chat Service
# Builds a hybrid ChromaDB vector index (Stage 1 chunks + Stage 2/3 Q&A pairs)
# and serves grounded answers via Streamlit.
# ============================================================
stage4:
  output_dir: "output/stage4"                       # NOT committed

  # Data sources for the index. Null = auto-resolve from earlier stage output_dirs.
  sources:
    markdown_glob: null                             # default: data/stage1_output/*.md
    augmented_jsonl: null                           # default: output/stage3/augmented.jsonl (preferred)
    qa_jsonl: null                                  # default: output/stage2/qa_pairs.jsonl (fallback)

  # Retrieval-specific chunker (RE-CHUNKS Stage 1 markdown — separate from Stage 2 chunking)
  chunking:
    max_tokens: 512                                 # slightly larger than Stage 2 — retrieval needs more context
    overlap_sentences: 1
    min_chunk_chars: 80

  # Sentence-transformer for indexing AND query-time embedding
  embedding:
    model: "all-MiniLM-L6-v2"                       # 384-d, same family used in Stage 2/3 dedup
    batch_size: 32
    device: "cpu"

  # Persistent ChromaDB store (SQLite + parquet under persist_dir)
  chroma:
    persist_dir: "output/stage4/chroma"
    collection_name: "hp_e877_manual"

  # Retrieval tuning
  retrieval:
    top_k: 10                                       # over-fetch, then score-filter
    max_final_hits: 5                               # cap what is shown to the LLM
    min_score: 0.3                                  # cosine similarity floor; empty list if none pass
    qa_fast_path_score: 0.85                        # promote a very-confident QA-pair hit to position 0

  # Answer generation — same Ollama stack as Stage 2/3
  llm:
    base_url: "http://localhost:11434"
    model: "qwen3.5:9b"                             # FIXED — was qwen2.5:3b (model not pulled, mismatched Stage 2/3)
    temperature: 0.2                                # LOW — grounded factual answers, not variety
    max_tokens: 1024
    timeout: 600
    max_context_chars: 6000                         # cap injected context so we don't blow past Qwen's window

  # UI
  ui:
    host: "localhost"
    port: 8501

  # FR028 — offline enforcement (blocks any non-loopback socket connection)
  offline:
    enforce: true
    log_path: "output/stage4/offline_guard.log"

# ─── OCR (optional, future scope) ───────────────────────────
ocr:
  enabled: false
  language: "en"
